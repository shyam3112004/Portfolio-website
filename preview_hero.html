<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Frame Sequence Preview</title>
<style>
  .hero-tester {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 780px;
    box-sizing: border-box;
    color: var(--foreground);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .viewport-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .viewport-container.mobile-ratio {
    aspect-ratio: 3 / 4;
    max-width: 360px;
  }
  .preview-canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .scrub-slider {
    flex: 1;
    min-width: 200px;
    accent-color: var(--accent);
  }
  .badge {
    font-size: 12px;
    font-family: monospace;
    padding: 4px 8px;
    border-radius: 6px;
    background: var(--border);
    color: var(--foreground);
  }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--foreground);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
  }
  .stat-item {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .stat-label {
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .stat-val {
    font-size: 16px;
    font-weight: 600;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="hero-tester">
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <strong style="font-size: 16px;">Hero Frame Scrub Tester</strong>
        <div style="font-size: 12px; color: var(--muted-foreground);">Scroll-driven video push-in inspection</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <button id="tab-desktop" class="btn" onclick="setMode('desktop')">Desktop (192f)</button>
        <button id="tab-mobile" class="btn btn-outline" onclick="setMode('mobile')">Mobile (192f)</button>
      </div>
    </div>

    <div id="viewport-wrap" class="viewport-container">
      <img id="active-frame" class="preview-canvas" src="public/frames/desktop/frame_0001.webp" alt="Frame">
    </div>

    <div class="controls">
      <button id="play-btn" class="btn btn-outline" onclick="togglePlay()">Play</button>
      <input id="scrubber" class="scrub-slider" type="range" min="1" max="192" value="1" oninput="onScrub(this.value)">
      <span id="frame-badge" class="badge">Frame: 1 / 192 (0.0%)</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-item">
      <div class="stat-label">Desktop Sequence</div>
      <div class="stat-val">192 frames &bull; 16.2 MB</div>
      <div style="font-size: 11px; color: #188038;">Full HD 1920x1080</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Mobile Sequence</div>
      <div class="stat-val">192 frames &bull; 3.21 MB</div>
      <div style="font-size: 11px; color: #188038;">&#10003; Target &le; 4 MB (960x540)</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">Video Fallback</div>
      <div class="stat-val">H.264 &bull; 3.72 MB</div>
      <div style="font-size: 11px; color: #188038;">8.0s @ 24fps</div>
    </div>
  </div>
</div>

<script>
  let currentMode = 'desktop';
  let isPlaying = false;
  let playTimer = null;
  const img = document.getElementById('active-frame');
  const scrubber = document.getElementById('scrubber');
  const badge = document.getElementById('frame-badge');
  const playBtn = document.getElementById('play-btn');
  const viewportWrap = document.getElementById('viewport-wrap');

  function setMode(mode) {
    currentMode = mode;
    stopPlay();
    scrubber.max = 192;
    if (mode === 'desktop') {
      viewportWrap.classList.remove('mobile-ratio');
      document.getElementById('tab-desktop').className = 'btn';
      document.getElementById('tab-mobile').className = 'btn btn-outline';
    } else {
      viewportWrap.classList.add('mobile-ratio');
      document.getElementById('tab-desktop').className = 'btn btn-outline';
      document.getElementById('tab-mobile').className = 'btn';
    }
    scrubber.value = 1;
    onScrub(1);
  }

  function onScrub(val) {
    const max = parseInt(scrubber.max);
    const frameNum = String(val).padStart(4, '0');
    const pct = ((val - 1) / (max - 1) * 100).toFixed(1);
    img.src = 'public/frames/' + currentMode + '/frame_' + frameNum + '.webp';
    badge.textContent = 'Frame: ' + val + ' / ' + max + ' (' + pct + '%)';
  }

  function togglePlay() {
    if (isPlaying) stopPlay();
    else startPlay();
  }

  function startPlay() {
    isPlaying = true;
    playBtn.textContent = 'Pause';
    playTimer = setInterval(() => {
      let next = parseInt(scrubber.value) + 1;
      if (next > parseInt(scrubber.max)) next = 1;
      scrubber.value = next;
      onScrub(next);
    }, 42); // ~24fps
  }

  function stopPlay() {
    isPlaying = false;
    playBtn.textContent = 'Play';
    if (playTimer) clearInterval(playTimer);
  }
</script>
</body>
</html>
