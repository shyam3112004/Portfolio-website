    .work-page-wrap { padding-top: 100px; min-height: 80vh; }
    .work-container { max-width: var(--max-width); margin: 0 auto; padding: 40px 24px 100px; }
    .work-header { margin-bottom: 48px; }
    .work-title { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 3.5rem); font-weight: 700; margin-bottom: 16px; letter-spacing: -0.02em; }

<body>
  <!-- Header -->
  <header class="header scrolled" id="main-header">
    <a href="/" class="logo">SHYAM KUMAR S</a>
    <nav>
      <ul class="nav-links">
        <li><a href="/#work" class="nav-link">&larr; Portfolio Home</a></li>

  <main class="work-page-wrap">
    <div class="work-container">
      <div class="work-header">
        <span class="section-label">Archive</span>
        <h1 class="work-title">Selected Engineering Work</h1>
        <p class="work-desc">In-depth technical case studies detailing architecture decisions, performance benchmarks, and production outcomes.</p>

      <div id="work-filter-chips" class="filter-chips"></div>
      <div id="work-projects-grid" class="projects-grid"></div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Shyam Kumar S. Crafted with semantic HTML, GSAP, and WebGL.</p>
  </footer>

  <script type="module">
    import { loadContent } from '/src/contentLoader.js';
    import { initProjects } from '/src/projects.js';

    async function run() {
      try {
        const config = await loadContent('home');
        const gridEl = document.getElementById('work-projects-grid');
        const filterEl = document.getElementById('work-filter-chips');
        if (config && config.projects) {
          initProjects(config.projects, gridEl, filterEl);
        }
      } catch (err) {
        console.error('Failed to load projects archive:', err);
      }
    }

    run();
  </script>
